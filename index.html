<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2027 TKT 尾牙抽獎 | 3D 擬真滿裝扭蛋系統</title>

  <!-- 資源預連線加速 -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>

  <!-- 關鍵樣式優先載入 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 核心 3D 與邏輯庫 -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script defer src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tkt: {
              blue: '#0000FF',
              dark: '#0000AA',
              light: '#3333FF',
              gold: '#F59E0B',
              bg: '#040714'
            }
          },
          boxShadow: {
            'glow-blue': '0 0 35px rgba(0, 0, 255, 0.45)',
            'glow-gold': '0 0 45px rgba(245, 158, 11, 0.65)',
            'glow-gold-lg': '0 0 70px rgba(245, 158, 11, 0.85), 0 0 100px rgba(0, 0, 255, 0.45)',
            'neon-chute': 'inset 0 0 20px rgba(0,0,0,0.95), 0 0 15px rgba(0,0,255,0.35)'
          }
        }
      }
    }
  </script>

  <style>
    .glass-panel {
      background: rgba(11, 19, 43, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    @keyframes crank-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(4320deg); }
    }
    .spinning-crank {
      animation: crank-spin 5.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes egg-crack-glow {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.18); filter: brightness(2) drop-shadow(0 0 30px #F59E0B); }
      100% { transform: scale(0.9); filter: brightness(1.2); }
    }
    .egg-cracking {
      animation: egg-crack-glow 0.65s ease-in-out forwards;
    }

    @keyframes tense-heartbeat {
      0%, 100% { transform: scale(1); }
      20% { transform: scale(1.10); }
      40% { transform: scale(0.97); }
      60% { transform: scale(1.06); }
    }
    .tense-egg-pulse {
      animation: tense-heartbeat 0.45s ease-in-out infinite;
    }

    @keyframes sheep-float-motion {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-3.5px) rotate(-2.5deg); }
      75% { transform: translateY(2px) rotate(2deg); }
    }
    .anim-sheep-float {
      animation: sheep-float-motion 3.2s ease-in-out infinite;
      display: inline-block;
      transform-origin: center bottom;
    }

    @keyframes firecracker-swing-motion {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      30% { transform: rotate(5.5deg) translateY(-1px); }
      75% { transform: rotate(-5.5deg) translateY(0.5px); }
    }
    .anim-cracker-swing {
      animation: firecracker-swing-motion 2.6s ease-in-out infinite;
      display: inline-block;
      transform-origin: 50% 10%;
    }

    @keyframes golden-ambient-pulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(245, 158, 11, 0.35), inset 0 0 15px rgba(245, 158, 11, 0.2);
        border-color: rgba(245, 158, 11, 0.85);
      }
      50% {
        box-shadow: 0 0 45px rgba(245, 158, 11, 0.75), inset 0 0 25px rgba(245, 158, 11, 0.4);
        border-color: rgba(254, 240, 138, 0.95);
      }
    }
    .prize-box-neon {
      animation: golden-ambient-pulse 4.8s ease-in-out infinite;
      position: relative;
    }

    /* 連貫絲滑金光流淌 */
    @keyframes golden-continuous-flow {
      0% {
        transform: translate3d(-150%, 0, 0) rotate(18deg);
        opacity: 0;
      }
      20% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.85;
      }
      100% {
        transform: translate3d(150%, 0, 0) rotate(18deg);
        opacity: 0;
      }
    }

    .prize-golden-shimmer-smooth {
      position: absolute;
      top: -60%;
      left: -20%;
      width: 140%;
      height: 220%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(251, 191, 36, 0) 30%,
        rgba(254, 240, 138, 0.25) 45%,
        rgba(255, 255, 255, 0.8) 50%,
        rgba(245, 158, 11, 0.45) 55%,
        rgba(251, 191, 36, 0) 70%,
        transparent 100%
      );
      pointer-events: none;
      will-change: transform, opacity;
      animation: golden-continuous-flow 4.8s linear infinite;
    }

    @keyframes golden-dust-float {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(0.8);
        opacity: 0.2;
      }
      50% {
        transform: translate3d(4px, -4px, 0) scale(1.15);
        opacity: 0.85;
      }
    }
    .golden-dust-particle {
      position: absolute;
      border-radius: 9999px;
      background: #FDE047;
      box-shadow: 0 0 6px #F59E0B;
      pointer-events: none;
      will-change: transform, opacity;
      animation: golden-dust-float 4.2s ease-in-out infinite;
    }

    .golden-prize-text {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF3B0 25%, #F59E0B 55%, #FFF0BA 80%, #D97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 6px rgba(245, 158, 11, 0.45));
    }

    @keyframes pop-box-in {
      0% { transform: scale(0.85); opacity: 0; }
      65% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .prize-box-enter {
      animation: pop-box-in 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 獎品英文字串強制單行、不換行、不斷字 */
    .prize-en-nowrap {
      white-space: nowrap !important;
      word-break: keep-all !important;
      overflow-wrap: normal !important;
      hyphens: none !important;
      display: inline-block;
    }

    @media print {
      body * { visibility: hidden; }
      #qrAdminDrawer, #qrAdminDrawer * { visibility: visible; }
      #qrAdminDrawer {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
      }
      .no-print, .hide-in-print { display: none !important; }
      #qrCardsContainer {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 20px !important;
      }
      .ticket-print-card {
        page-break-inside: avoid;
        border: 2px dashed #334155 !important;
        background: #ffffff !important;
        color: #0f172a !important;
        padding: 16px !important;
      }
      .ticket-print-card .secret-ticket-desc {
        display: block !important;
      }
    }
  </style>
</head>
<body class="bg-tkt-bg text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden relative">

  <!-- 背景金藍光暈 -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">

  <!-- 專屬提示橫幅 -->
  <div id="exclusiveBanner" class="hidden relative z-20 bg-gradient-to-r from-blue-950 via-tkt-blue to-indigo-950 border-b border-blue-400/30 px-4 py-2 text-center text-xs sm:text-sm shadow-md">
    <div class="inline-flex items-center gap-2">

  <!-- 主互動區：3D 滿裝扭蛋舞台 -->

      <div class="text-center px-1">
